name: Build static site
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'partials/**'
      - 'templates/**'
      - 'pages/**'
      - 'content/**'
      - 'lib/**'
      - 'build.cjs'
      - 'out/site.css'
      - 'out/site.js'
concurrency:
  group: tide-static-build
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: pnpm install --frozen-lockfile
      - run: node build.cjs
      - run: |
          git config user.name "TIDE site builder"
          git config user.email "site-builder@users.noreply.github.com"
          git add pages out
          git diff --cached --quiet || git commit -m "Rebuild static pages from edited content"
          git push
