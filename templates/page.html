<main id="main">
  <section class="hero {{heroClass}}">
    {{{picture}}}
    <div class="hero-shade"></div>
    <div class="hero-copy">{{{intro}}}</div>
    {{{heroCaption}}}
  </section>
  <div class="page-layout">
    <aside class="page-aside">
      <p class="eyebrow">{{sectionLabel}}</p>
      <div id="toc"></div>
      {{{storyLink}}}
    </aside>
    <article class="page-content {{contentClass}}">{{{body}}}</article>
  </div>
</main>
